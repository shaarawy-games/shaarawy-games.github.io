<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="موقع ألعاب شعراوي — ألعاب ممتعة للعب والتحميل مجانًا">
  <meta name="keywords" content="ألعاب شعراوي, غمزة, ألعاب جماعية, ألعاب مجانية">
  <meta name="theme-color" content="#130f22">
  <title>ألعاب شعراوي | ألعاب مجانية للعب والتحميل</title>
  <style>
    :root{--bg:#0b0911;--card:#171225;--line:#32274c;--gold:#ffd239;--text:#fff;--muted:#bcb6ca;--purple:#7652d8}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% 0,#2c1760 0,transparent 35%),var(--bg);color:var(--text);font-family:Tahoma,Arial,sans-serif;min-height:100vh}a{text-decoration:none;color:inherit}.wrap{width:min(1120px,calc(100% - 32px));margin:auto}.top{display:flex;align-items:center;justify-content:space-between;padding:22px 0}.logo{font-weight:900;font-size:1.25rem;color:var(--gold)}.badge{border:1px solid var(--line);background:#151020;padding:9px 13px;border-radius:999px;color:var(--muted);font-size:.9rem}.hero{padding:62px 0 42px}.hero h1{font-size:clamp(2.5rem,8vw,5.4rem);margin:0 0 14px;line-height:1.05}.hero h1 span{color:var(--gold)}.hero p{font-size:1.15rem;color:var(--muted);line-height:1.8;max-width:620px;margin:0}.section-title{font-size:1.45rem;margin:24px 0 16px}.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px;padding-bottom:70px}.game{background:linear-gradient(145deg,#1c1530,#12101b);border:1px solid var(--line);border-radius:26px;padding:18px;box-shadow:0 20px 50px #0005}.cover{aspect-ratio:16/10;background:#24173d;border-radius:19px;overflow:hidden;display:grid;place-items:center}.cover img{width:100%;height:100%;object-fit:cover}.game h2{font-size:1.7rem;margin:18px 2px 8px}.game p{color:var(--muted);line-height:1.7;margin:0 2px 17px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{display:block;text-align:center;padding:13px 12px;border-radius:14px;font-weight:900}.play{background:var(--gold);color:#171006}.download{background:#2d2344;color:#ddd}.soon{opacity:.55;cursor:not-allowed}.footer{border-top:1px solid #211a30;text-align:center;color:var(--muted);padding:24px 0;font-size:.92rem}@media(max-width:480px){.hero{padding:35px 0 28px}.actions{grid-template-columns:1fr}.badge{display:none}}
  </style>
</head>
<body>
  <header class="wrap top"><div class="logo">SHAARAWY GAMES</div><div class="badge">ألعاب مجانية</div></header>
  <main class="wrap">
    <section class="hero"><h1>العبها مع <span>شِلّتك</span></h1><p>ألعاب جماعية خفيفة وممتعة من صنع شعراوي. العب مباشرة من المتصفح، وقريبًا حمّل نسخ أندرويد.</p></section>
    <h2 class="section-title">الألعاب</h2>
    <section class="games">
      <article class="game">
        <div class="cover"><img src="images/ghamza-icon.png" alt="شعار لعبة غمزة"></div>
        <h2>غمزة</h2>
        <p>اعرف دورك بسرية، راقب الغمزات واكتشف الغامز قبل ما تتكشف اللعبة.</p>
        <div class="actions"><a class="btn play" href="games/ghamza/">العب الآن</a><span class="btn download soon" title="نسخة أندرويد ستتوفر قريبًا">APK قريبًا</span></div>
      </article>
    </section>
  </main>
  <footer class="footer">© 2026 ألعاب شعراوي — جميع الحقوق محفوظة</footer>
</body>
</html>
