<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#120b14"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><title>القنبلة أونلاين | صنع شعراوي</title><style>
:root{--bg:#09070d;--card:#19111f;--line:#3b2943;--text:#fff8ee;--muted:#bdb2c4;--red:#ff4057;--orange:#ff9f1c;--green:#43d39e}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#4a142a 0,#170b17 38%,var(--bg) 75%);color:var(--text);font-family:Tahoma,Arial,sans-serif;padding:14px}button,input,select{font:inherit}.app{width:min(560px,100%);margin:auto}.install{position:fixed;left:14px;bottom:14px;z-index:20;width:auto;border:0;border-radius:14px;padding:11px 15px;background:var(--orange);color:#19090c;font-weight:900;box-shadow:0 8px 28px #000a}.brand{text-align:center;margin:8px 0 20px}.maker{color:var(--orange);font-weight:900;letter-spacing:3px}.brand h1{font-size:clamp(2.7rem,12vw,4.5rem);margin:4px 0}.brand p{color:var(--muted);margin:0}.panel{background:#19111fee;border:1px solid var(--line);border-radius:26px;padding:20px;box-shadow:0 22px 60px #0008}.screen{display:none}.screen.on{display:block}h2{text-align:center}.lead{color:var(--muted);line-height:1.8;text-align:center}.tabs,.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}.tab{background:#2c1e34;color:#fff;border:0;border-radius:14px;padding:12px;font-weight:800}.tab.active{background:var(--orange);color:#1a0b0e}label{display:block;color:var(--muted);font-weight:800;margin:15px 2px 7px}input,select{width:100%;background:#0d0910;color:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;outline:none}input:focus,select:focus{border-color:var(--orange)}button{cursor:pointer}.primary,.secondary{width:100%;border:0;border-radius:15px;padding:14px;font-weight:900;margin-top:14px}.primary{background:linear-gradient(135deg,var(--orange),var(--red));color:#19090c}.secondary{background:#30223a;color:#fff}.room-code{text-align:center;font-size:2.4rem;letter-spacing:7px;color:var(--orange);font-weight:900;background:#0d0910;border:1px dashed #74425c;border-radius:18px;padding:15px}.players{display:grid;gap:8px;margin:14px 0}.person,.score{display:flex;justify-content:space-between;align-items:center;background:#0d0910;border:1px solid var(--line);border-radius:13px;padding:11px 13px}.dot{width:9px;height:9px;border-radius:50%;background:var(--green);display:inline-block;margin-left:7px}.host{color:var(--orange);font-size:.8rem}.bomb{text-align:center;font-size:6.5rem;filter:drop-shadow(0 0 22px #ff405788);animation:pulse .7s infinite alternate}.bomb.danger{animation:shake .12s infinite}.turn{text-align:center;color:var(--orange);font-size:1.45rem;font-weight:900}.challenge{min-height:155px;display:grid;place-items:center;text-align:center;background:#0d0910;border:1px dashed #70455f;border-radius:20px;padding:18px;margin:12px 0}.challenge h2{line-height:1.6}.wait{text-align:center;color:var(--muted);font-weight:800}.boom{text-align:center}.boom h2{color:var(--red);font-size:2.1rem}.score b:last-child{color:var(--orange)}.status{text-align:center;color:var(--muted);margin-top:12px}.error{color:#ff9aab}.hidden{display:none!important}@keyframes pulse{to{transform:scale(1.08)}}@keyframes shake{from{transform:translateX(-3px)}to{transform:translateX(3px)}}@media(max-width:390px){.panel{padding:16px}.brand h1{font-size:2.8rem}}
</style></head><body><main class="app"><header class="brand"><div class="maker">صنع شعراوي</div><h1>القنبلة</h1><p>رومات أونلاين مع أصحابك</p></header><section class="panel">
<div id="home" class="screen on"><div class="tabs"><button class="tab active" id="createTab">إنشاء روم</button><button class="tab" id="joinTab">دخول روم</button></div><div id="createForm"><label>اسمك</label><input id="hostName" maxlength="20" placeholder="اكتب اسمك"><label>وقت الجولة</label><select id="time"><option value="30">30 ثانية</option><option value="60">دقيقة</option><option value="90" selected>دقيقة ونصف</option><option value="120">دقيقتان</option><option value="150">دقيقتان ونصف</option><option value="180">3 دقائق</option><option value="210">3 دقائق ونصف</option><option value="240">4 دقائق</option><option value="270">4 دقائق ونصف</option><option value="300">5 دقائق</option></select><button class="primary" id="create">أنشئ الروم</button></div><div id="joinForm" class="hidden"><label>اسمك</label><input id="joinName" maxlength="20" placeholder="اكتب اسمك"><label>رقم الروم</label><input id="joinCode" inputmode="numeric" maxlength="6" placeholder="مثال: 482731"><button class="primary" id="join">دخول الروم</button></div><div class="status" id="connectStatus">جاري الاتصال…</div></div>
<div id="lobby" class="screen"><h2>رقم الروم</h2><div class="room-code" id="roomCode"></div><button class="secondary" id="copy">نسخ رقم الروم</button><h3>اللاعبون</h3><div class="players" id="players"></div><p class="wait" id="lobbyWait">مستنيين صاحب الروم يبدأ…</p><button class="primary hidden" id="start">ابدأ اللعبة</button></div>
<div id="game" class="screen"><div class="turn" id="turn"></div><div class="bomb" id="bomb">💣</div><div class="challenge"><h2 id="challenge"></h2></div><button class="primary hidden" id="pass">جاوبت — الدور للي بعدي</button><p class="wait" id="turnWait"></p><p class="status">الوقت مخفي… جاوب بسرعة!</p></div>
<div id="result" class="screen boom"><div class="bomb">💥</div><h2>بوووم!</h2><div class="turn" id="loser"></div><p class="lead">أخذ 0 نقطة، وكل لاعب تاني أخذ 100 نقطة.</p><h3>السكور</h3><div class="players" id="scores"></div><button class="primary hidden" id="again">جولة جديدة</button><p class="wait" id="resultWait">مستنيين صاحب الروم…</p></div>
</section></main><button id="installApp" class="install hidden">⬇ تثبيت القنبلة</button><script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';import{getAuth,signInAnonymously}from'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';import{getDatabase,ref,set,get,update,onValue,onDisconnect,serverTimestamp}from'https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js';
const config={apiKey:'AIzaSyD4wTv9t8nXVmXhhGM-OIF7NwdPsRCXysw',authDomain:'shaarawy-games.firebaseapp.com',databaseURL:'https://shaarawy-games-default-rtdb.firebaseio.com',projectId:'shaarawy-games',storageBucket:'shaarawy-games.firebasestorage.app',messagingSenderId:'60519559726',appId:'1:60519559726:web:dacbd0e6440c6b5891a5bf'};
const challenges=['قول اسم 3 بلاد','قول 4 أكلات تبدأ بحرف الميم','عدّ من 10 إلى 1 بسرعة','قول أسماء 3 لاعبين كرة','اذكر 4 ألوان','قول 3 حيوانات','اذكر 3 أفلام أو مسلسلات','قول 4 أسماء ولاد','قول 4 أسماء بنات','اذكر 3 حاجات موجودة في المدرسة','قول 3 فواكه','اذكر 4 مهن','قول 3 ألعاب موبايل','اذكر 3 مدن مصرية','قول 4 حاجات لونها أبيض','قول 3 مشروبات','اذكر 4 رياضات','قول 3 كلمات تبدأ بحرف السين','اذكر 3 وسائل مواصلات','قول 4 حاجات موجودة في البيت','اذكر 3 أجهزة كهربائية','قول 3 أكلات مصرية','اذكر 3 تطبيقات موبايل','قول 4 حاجات بتلبسها','اذكر 3 فرق كرة قدم','قول 3 أنواع حلويات','اذكر 3 حيوانات تعيش في البحر','قول 3 حاجات بنعملها الصبح'];
const $=x=>document.getElementById(x),screens=['home','lobby','game','result'];let auth,db,user,code='',room=null,isHost=false,boomTimer=null;
function show(id){screens.forEach(x=>$(x).classList.toggle('on',x===id))}function clean(s){return s.trim().slice(0,20)}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function err(m){$('connectStatus').textContent=m;$('connectStatus').classList.add('error')}
function tabs(create){$('createForm').classList.toggle('hidden',!create);$('joinForm').classList.toggle('hidden',create);$('createTab').classList.toggle('active',create);$('joinTab').classList.toggle('active',!create)}$('createTab').onclick=()=>tabs(true);$('joinTab').onclick=()=>tabs(false);
try{const app=initializeApp(config);auth=getAuth(app);db=getDatabase(app);user=(await signInAnonymously(auth)).user;$('connectStatus').textContent='متصل — ابدأ دلوقتي'}catch(e){err('تعذر الاتصال. اتأكد إن الإنترنت شغال.')}
async function makeRoom(){const name=clean($('hostName').value);if(!name)return err('اكتب اسمك الأول');for(let n=0;n<6;n++){const c=String(Math.floor(100000+Math.random()*900000));try{await set(ref(db,'rooms/'+c),{hostId:user.uid,status:'lobby',time:Number($('time').value),createdAt:serverTimestamp(),players:{[user.uid]:{name,score:0}}});code=c;isHost=true;enterRoom();return}catch(e){}}err('جرب إنشاء الروم مرة تانية')}
async function joinRoom(){const name=clean($('joinName').value),c=$('joinCode').value.replace(/\D/g,'');if(!name||c.length!==6)return err('اكتب اسمك ورقم روم مكوّن من 6 أرقام');try{await set(ref(db,`rooms/${c}/players/${user.uid}`),{name,score:0});code=c;isHost=false;enterRoom()}catch(e){err('الروم مش موجود أو بدأ اللعب بالفعل')}}
function enterRoom(){if(isHost)onDisconnect(ref(db,`rooms/${code}`)).remove();else onDisconnect(ref(db,`rooms/${code}/players/${user.uid}`)).remove();onValue(ref(db,'rooms/'+code),snap=>{if(!snap.exists()){alert('الروم اتقفل');location.reload();return}room=snap.val();render()});$('roomCode').textContent=code;show('lobby')}
function playerList(){return Object.entries(room?.players||{}).map(([id,p])=>({id,...p}))}function render(){const ps=playerList();$('players').innerHTML=ps.map(p=>`<div class="person"><b><span class="dot"></span>${esc(p.name)}</b>${p.id===room.hostId?'<span class="host">صاحب الروم</span>':''}</div>`).join('');$('start').classList.toggle('hidden',!isHost);$('lobbyWait').classList.toggle('hidden',isHost);if(room.status==='lobby'){show('lobby')}else if(room.status==='playing'){show('game');renderGame(ps)}else if(room.status==='result'){show('result');renderResult(ps)}}
function renderGame(ps){const g=room.game||{},current=ps.find(p=>p.id===g.currentId);$('turn').textContent='الدور على: '+(current?.name||'—');$('challenge').textContent=challenges[g.challenge%challenges.length];const mine=g.currentId===user.uid;$('pass').classList.toggle('hidden',!mine);$('turnWait').textContent=mine?'دورك! جاوب واضغط الزر.':'مستنيين '+(current?.name||'اللاعب')+' يجاوب…';if(isHost&&!boomTimer){const left=Math.max(0,g.endsAt-Date.now());boomTimer=setTimeout(hostExplode,left);setTimeout(()=>{$('bomb').classList.add('danger')},Math.max(1000,left-9000))}}
async function startRound(){const ps=playerList();if(ps.length<2){alert('لازم لاعبين على الأقل');return}const first=ps[Math.floor(Math.random()*ps.length)];boomTimer=null;await update(ref(db,'rooms/'+code),{status:'playing',game:{currentId:first.id,challenge:Math.floor(Math.random()*challenges.length),endsAt:Date.now()+room.time*1000,round:(room.game?.round||0)+1}})}
async function passTurn(){const ps=playerList(),i=ps.findIndex(p=>p.id===room.game.currentId),next=ps[(i+1)%ps.length];await update(ref(db,`rooms/${code}/game`),{currentId:next.id,challenge:room.game.challenge+1})}
async function hostExplode(){boomTimer=null;const snap=await get(ref(db,'rooms/'+code));if(!snap.exists()||snap.val().status!=='playing')return;const r=snap.val(),loser=r.game.currentId,changes={status:'result','game/loserId':loser};Object.entries(r.players||{}).forEach(([id,p])=>{if(id!==loser)changes[`players/${id}/score`]=(p.score||0)+100});await update(ref(db,'rooms/'+code),changes)}
function renderResult(ps){const loser=ps.find(p=>p.id===room.game?.loserId);$('loser').textContent='القنبلة وقفت عند: '+(loser?.name||'—');$('scores').innerHTML=[...ps].sort((a,b)=>(b.score||0)-(a.score||0)).map((p,i)=>`<div class="score"><b>${i+1}. ${esc(p.name)}</b><b>${p.score||0} نقطة</b></div>`).join('');$('again').classList.toggle('hidden',!isHost);$('resultWait').classList.toggle('hidden',isHost)}
$('create').onclick=makeRoom;$('join').onclick=joinRoom;$('copy').onclick=async()=>{await navigator.clipboard.writeText(code);$('copy').textContent='تم النسخ ✓'};$('start').onclick=startRound;$('pass').onclick=passTurn;$('again').onclick=startRound;
let installPrompt=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;$('installApp').classList.remove('hidden')});$('installApp').onclick=async()=>{if(installPrompt){installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;$('installApp').classList.add('hidden')}};if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');if(new URLSearchParams(location.search).has('install'))setTimeout(()=>$('installApp').classList.remove('hidden'),500);
</script></body></html>
